name: Public CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

  tree:
    name: Public structure and hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Check public structure and hygiene
        run: bash scripts/check-public-tree.sh

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # The same files as the released zip: no repository documents, brand
      # marks, directory images or automation.
      - name: Assemble the plugin folder
        run: |
          mkdir -p build/bladecp-migrator/assets
          cp bladecp-migrator.php uninstall.php readme.txt LICENSE build/bladecp-migrator/
          cp -R includes languages build/bladecp-migrator/
          cp -R assets/css assets/js assets/fonts build/bladecp-migrator/assets/

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './build/bladecp-migrator'
          slug: 'bladecp-migrator'
