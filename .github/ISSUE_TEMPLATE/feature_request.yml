name: Feature request
description: Suggest an improvement for BladeCP Migrator.
title: "Feature: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you for sharing an idea. Please do not include keys, passwords, site data or other sensitive information.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the site, the hosting or the step of the migration that motivates the request.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or user experience you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or alternative approaches you have considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, screenshots or relevant implementation considerations.
    validations:
      required: false
